{{#def.Header}}

<div class="uk-overflow-auto">
    <h2>relations-dil</h2>
    <p>
        The apps are listed in <code>app.js</code>, and each one's models are in
        <code>models/&lt;app&gt;.js</code>. The screens are built from the models' definitions.
    </p>
    <ul class="uk-list uk-list-divider">
{{~ DRApp.apps :app}}
        <li><a href="{{=DRApp.link(app.name + '_home')}}">{{= app.title }}</a></li>
{{~}}
    </ul>
</div>

{{#def.Footer}}
